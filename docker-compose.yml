# One-command local stack: PostgreSQL + backend API + frontend.
#
#   docker compose up --build
#
# Backend:  http://localhost:3000  (GET /health)
# Frontend: http://localhost:5173
#
# Contract addresses are optional here; set them in the shell or in a root
# `.env` file to bake them into the frontend image, e.g.:
#   VITE_ESCROW_CONTRACT_ID=C... docker compose up --build
#
# Testnet values live in deployments/testnet.json.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freelance_stellar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freelance_stellar"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/freelance_stellar
      # Dev-only placeholder. Must be >= 32 chars (enforced by the config schema).
      JWT_SECRET: dev-only-insecure-secret-change-me-please
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      INDEXER_POLL_INTERVAL_MS: 5000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_NETWORK: ${VITE_NETWORK:-testnet}
        VITE_ESCROW_CONTRACT_ID: ${VITE_ESCROW_CONTRACT_ID:-}
        VITE_DISPUTE_CONTRACT_ID: ${VITE_DISPUTE_CONTRACT_ID:-}
        VITE_REPUTATION_CONTRACT_ID: ${VITE_REPUTATION_CONTRACT_ID:-}
        VITE_USDC_CONTRACT_ID: ${VITE_USDC_CONTRACT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
