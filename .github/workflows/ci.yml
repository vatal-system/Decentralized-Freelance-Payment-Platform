name: CI

# Every job here only reads the repository: checkout, toolchains, npm/cargo,
# cache. Scope the token to that and nothing more (issue #111); if a step ever
# needs more, widen it in that job's `permissions:` block — restating
# `contents: read`, because a job-level block replaces this one. Enforced by
# backend/src/__tests__/ciWorkflows.test.ts; conventions in CONTRIBUTING.md →
# CI workflows.
permissions:
  contents: read

on:
  push:
    # `integration/staging` is where contribution PRs are integrated before
    # `main`; without it here, CI would never run on those pull requests.
    branches: [main, integration/staging]
  pull_request:
    branches: [main, integration/staging]

jobs:
  contracts:
    name: Contracts – fmt, clippy, test, wasm
    runs-on: ubuntu-latest
    # Job-level block, so `contents: read` is restated. `attestations: read`
    # is what the stellar-cli action's `gh attestation verify` step needs to
    # fetch the release attestation with the workflow token (issue #111).
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, 2026-10-16
        with:
          # The `stable` branch's action.yml defaults the toolchain to
          # `stable`; once pinned by SHA, say it outright.
          toolchain: stable
          components: rustfmt, clippy
          # Soroban SDK v28+ builds for wasm32v1-none (not wasm32-unknown-unknown).
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The Soroban SDK build script requires stellar-cli v25.2.0+ to build wasm.
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          # The action builds its download URL from the ref it is invoked at,
          # so a SHA pin has to name the release (otherwise the tarball 404s).
          version: v28.1.0

      - name: Build wasm
        run: stellar contract build

      # Soroban enforces a 64 KB (65 536 byte) compressed contract limit.
      # Fail fast here rather than discovering the overage at mainnet deploy.
      - name: Check wasm binary sizes (≤ 64 KB compressed)
        run: |
          MAX_BYTES=65536
          FAILED=0
          for wasm in target/wasm32v1-none/release/*.wasm; do
            SIZE=$(gzip -c "$wasm" | wc -c)
            echo "$wasm: ${SIZE} bytes compressed"
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "ERROR: $wasm exceeds the Soroban 64 KB compressed limit (${SIZE} > ${MAX_BYTES})"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  frontend:
    name: Frontend – lint, typecheck, test, coverage, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
      - name: Verify bundle size budget (<= 350kB gzipped)
        run: npm run check:bundlesize

      # Issue #286: publish the lcov report generated by Vitest above.
      # `fail_ci_if_error: false` keeps a Codecov outage from blocking an
      # otherwise-green PR; the coverage artifact is still produced locally.
      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  backend:
    name: Backend – typecheck, migrations, test & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # `backend/Dockerfile` runs `prisma migrate deploy` when the container
    # starts, so a broken or drifted migration is otherwise only discovered in
    # production. A real Postgres lets us apply the committed migrations and
    # prove they reproduce `schema.prisma` exactly.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freelance_stellar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freelance_stellar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freelance_stellar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      # Apply every committed migration to an empty database. A migration that
      # does not run (broken SQL, a bad ordering) fails the build here, exactly
      # as it would fail the container's start-up command (#53).
      - name: Apply migrations
        run: npx prisma migrate deploy

      # `--exit-code

      - name: Test migrations rollback and reapplication
        run: bash ../scripts/test_migrations.sh` makes `migrate diff` exit non-zero when the migration
      # history and `schema.prisma` disagree, so editing the schema without a
      # matching migration fails instead of reaching production as drift.
      - name: Migrations reproduce the schema (drift check)
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - run: npx tsc --noEmit
      - run: npm run test:coverage

      # Issue #286: publish the lcov report generated by Vitest above.
      - name: Upload backend coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Build both shipped images here so a Dockerfile change is reviewed in the
  # same run as its source, and cache every layer in the Actions cache (issues
  # #284 and #289). Without `cache-to: type=gha`, each run rebuilds `npm ci`,
  # the Prisma client and the Vite bundle from scratch; with it, only the layers
  # whose inputs changed (usually just the source copy) are rebuilt.
  #
  # `scope` keeps the two images' caches separate — they share the node base
  # layer but have different lockfiles and build steps.
  docker:
    name: Docker – build images with layer cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          # The image is only a build artifact here: no registry credentials
          # are available to the read-only token, and nothing is pushed.
          push: false
          load: false
          tags: freelance-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          tags: freelance-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Dependency vulnerability gate (issue #287).
  #
  # Blocking, not advisory: the lockfiles were remediated as part of the same
  # change (express, zod, the stellar-sdk HTTP stack — axios, follow-redirects,
  # form-data — proxy-addr, source-map-js, plus a toml override for
  # @stellar/stellar-sdk), so production audits are clean and a new high or
  # critical advisory now fails the workflow instead of being ignored.
  # CONTRIBUTING.md → Dependency security is the policy of record.
  audit:
    name: Dependencies – vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # `npm audit` reads the committed lockfile, so no install is needed.
      # `--omit=dev` keeps the report to what actually ships: build/test tooling
      # (vite, vitest, eslint) is not audited here.
      - name: npm audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts

      # Covers the whole workspace, including the dev-dependencies the contract
      # tests pull in. `--locked` builds cargo-audit against its own pinned
      # dependency set. The workspace carries one documented ignore
      # (contracts/.cargo/audit.toml, RUSTSEC-2026-0387) with its upgrade path;
      # any other advisory fails this job.
      - name: cargo audit (contracts)
        working-directory: contracts
        run: |
          cargo install cargo-audit --locked
          cargo audit

