# Render Blueprint for the backend API.
#
# Deploy with: Render Dashboard → New → Blueprint → pick this repository.
# See docs/DEPLOYMENT.md for the full walkthrough.
#
# Why a Render web service and not a serverless function: the API starts the
# Soroban event indexer in-process (backend/src/server.ts), so it needs a
# container that stays up. The indexer persists its cursor in Postgres, so if a
# free instance spins down while idle it catches up from the last processed
# ledger when it wakes — no events are lost, they are just applied later.
#
# DATABASE_URL is intentionally not created here: the project uses a managed
# Postgres (Tiger Cloud, free tier). Set it in the dashboard after creating the
# Blueprint. To use Render's own Postgres instead, add:
#
#   databases:
#     - name: freelance-stellar-db
#       databaseName: freelance_stellar
#       plan: free
#
# and point DATABASE_URL at it with `fromDatabase`.
#
# The container runs `npx prisma migrate deploy && node dist/server.js`, so
# migrations apply on every boot.

services:
  - type: web
    name: stellar-freelance-api
    runtime: docker
    plan: free
    region: oregon
    # The build context is the repository root: the Dockerfile copies in
    # deployments/testnet.json (the committed deploy record) so the API can warn
    # at startup when its env vars point at superseded contracts (issue #91).
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploys are deliberate: `git push` should not roll production forward on
    # its own. Switch to `checksPass` to deploy automatically once this repo's
    # CI checks pass for the commit (`autoDeployTrigger` replaces the deprecated
    # `autoDeploy` field).
    # Quoted: YAML reads a bare `off` as boolean false, and this field is a string.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production

      # Persisted PostgreSQL. Set this to the Tiger Cloud connection string.
      - key: DATABASE_URL
        sync: false

      # Signing key for auth tokens; Render generates a strong value.
      - key: JWT_SECRET
        generateValue: true

      - key: STELLAR_NETWORK
        value: testnet
      - key: HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org

      # Deployed contract ids — DELIBERATELY NOT committed (issue #91).
      #
      # They change on every `scripts/deploy_testnet.sh` run, which writes them
      # to deployments/testnet.json and backend/.env.contracts and prints the
      # exact values to set. A committed copy goes stale the moment the contracts
      # are redeployed, and a stale backend silently indexes the superseded
      # contracts. `sync: false` makes Render prompt for (and keep) these in the
      # dashboard: set them from the script's output and redeploy after each
      # contract deploy. The API also warns at startup when its configured ids no
      # longer match deployments/testnet.json.
      - key: ESCROW_CONTRACT_ID
        sync: false
      - key: DISPUTE_CONTRACT_ID
        sync: false
      - key: REPUTATION_CONTRACT_ID
        sync: false

      # The testnet XLM SAC is stable across contract deploys, so it is safe to
      # commit.
      - key: XLM_CONTRACT_ID
        value: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC

      # Dispute panel. It tracks the deployer/admin, so set it alongside the
      # contract ids above; empty would fail the resolve route closed.
      - key: ARBITRATOR_ADDRESSES
        sync: false

      # The deployed frontend. Leaving this out allows every origin.
      - key: CORS_ORIGIN
        value: https://stellar-freelance-frontend.vercel.app

      - key: INDEXER_POLL_INTERVAL_MS
        value: "5000"

      # Render web services sit behind a single reverse proxy hop.
      - key: TRUST_PROXY
        value: "1"

# Health probes
# -------------
# The /health endpoint is a lightweight liveness probe that checks:
#   - PostgreSQL connectivity (SELECT 1)
#   - Indexer cursor has advanced beyond ledger 0
# Returns 200 { status: "ok", db: true, indexer: true } or 503 if unhealthy.
#
# The /ready endpoint is a readiness check for platform orchestration:
#   - Same checks as /health, intended for gating traffic.
#   - Platforms (Render, Railway, Fly) should use this as the `readinessProbe`.
#   - Returns 200 when fully ready, 503 when any dependency is unhealthy.
#
# Render's healthCheckPath is set to /health (liveness probe). For readiness,
# use the /ready endpoint in your platform's configuration.
